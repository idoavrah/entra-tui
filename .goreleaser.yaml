# GoReleaser builds the cross-platform binaries published on each tag.
# https://goreleaser.com
version: 2

project_name: entra-tui

before:
  hooks:
    - go mod tidy

builds:
  - id: entra-tui
    main: ./cmd/entra-tui
    binary: entra-tui
    env:
      # A static binary: entra-tui shells out to `az` but links nothing.
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      # Windows on ARM is not a terminal anyone is asking for yet.
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '(?i)^(add|introduce)'
      order: 0
    - title: Fixes
      regexp: '(?i)^(fix|correct)'
      order: 1
    - title: Other
      order: 99
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: false
  prerelease: auto
  footer: |
    ## Install

    ```sh
    go install github.com/idoavrah/entra-tui/cmd/entra-tui@{{ .Tag }}
    ```

    Or download a binary above. Try it without a tenant:

    ```sh
    entra-tui -demo
    ```
